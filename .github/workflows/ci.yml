name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start MinIO (S3-compatible backend for live tests)
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native deps
        # Only runs install scripts for packages in pnpm.onlyBuiltDependencies
        # (sharp, @swc/core, esbuild, mongodb-memory-server, unrs-resolver).
        run: pnpm rebuild

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (with coverage)
        run: pnpm run test:int:cov

      - name: Test S3 against live MinIO
        env:
          BACKUP_STORAGE: s3
          BACKUP_S3_BUCKET: payload-backups-ci
          BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          BACKUP_S3_ACCESS_KEY_ID: minioadmin
          BACKUP_S3_SECRET_ACCESS_KEY: minioadmin
          BACKUP_S3_FORCE_PATH_STYLE: "true"
          BACKUP_S3_REGION: us-east-1
        run: |
          node ./scripts/ci-minio-setup.mjs
          pnpm run test:int:minio

      - name: Code coverage comments
        if: github.event_name == 'pull_request'
        uses: kcjpop/coverage-comments@v2.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: ./coverage/lcov.info

      - name: Build
        run: pnpm run build
